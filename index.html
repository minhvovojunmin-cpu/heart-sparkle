<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>💗</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 44%, #1a0310 0%, #070106 42%, #000 78%);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* nút bật/tắt tiếng tim đập: chỉ là icon, không có chữ */
  #sound {
    position: fixed; right: 14px; top: 14px; width: 40px; height: 40px; padding: 0;
    font-size: 1.05rem; cursor: pointer; border-radius: 50%; color: #fff;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,120,170,.25);
    opacity: .35; transition: opacity .3s; z-index: 5;
  }
  #sound:hover { opacity: .9; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="sound" aria-label="Bật tắt tiếng tim đập">🔇</button>

<script>
const BPM = Number(new URLSearchParams(location.search).get('bpm')) || 72;
const PARTICLES = 5600;

/* ============================ CANVAS ============================ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 10, CX = 0, CY = 0;

/* ============================ HÌNH DẠNG TRÁI TIM ============================
   Dùng đường cong ẩn (x²+y²-1)³ = x²y³ : bầu bĩnh, hai thùy tròn đầy,
   đỉnh khía và mũi tim đều nhọn sắc. Tính biên bằng cách dò bán kính theo góc. */
const N_TAB = 1440;
const TAB = [];           // biên trái tim, đã chuẩn hóa
let HEART_H = 30;         // chiều cao (đơn vị chuẩn hóa)
(function buildHeartTable() {
  const f = (x, y) => Math.pow(x * x + y * y - 1, 3) - x * x * y * y * y;
  const raw = [];
  let maxX = 0, minY = 1e9, maxY = -1e9;
  for (let i = 0; i < N_TAB; i++) {
    const a = i / N_TAB * Math.PI * 2, dx = Math.cos(a), dy = Math.sin(a);
    let lo = 0, hi = 2;
    for (let k = 0; k < 40; k++) {
      const m = (lo + hi) / 2;
      f(dx * m, dy * m) < 0 ? lo = m : hi = m;
    }
    const x = dx * lo, y = dy * lo;
    raw.push([x, y]);
    maxX = Math.max(maxX, Math.abs(x)); minY = Math.min(minY, y); maxY = Math.max(maxY, y);
  }
  const k = 16 / maxX, midY = (minY + maxY) / 2;
  for (const [x, y] of raw) TAB.push([x * k, -(y - midY) * k]);   // lật trục y cho canvas
  HEART_H = (maxY - minY) * k;
})();
// t ∈ [0, 2π) -> điểm trên biên
function heartXY(t) {
  const u = (((t / (Math.PI * 2)) % 1) + 1) % 1 * N_TAB;
  const i = Math.floor(u), f = u - i, a = TAB[i % N_TAB], b = TAB[(i + 1) % N_TAB];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(W * 0.8 / 32, H * 0.72 / HEART_H, 26);
  CX = W / 2; CY = H * 0.5;
}
resize();

/* ============================ SPRITES ============================ */
const PALETTE = [
  [255, 77, 141],   // 0 hồng sen
  [255, 126, 182],  // 1 hồng đào
  [255, 179, 209],  // 2 hồng phấn
  [255, 46, 116],   // 3 hồng đậm
  [255, 150, 200],  // 4 hồng kẹo
  [255, 105, 180],  // 5 hồng cánh sen
  [235, 80, 165],   // 6 hồng tím
  [255, 200, 225]   // 7 hồng nhạt
];
// pha màu với trắng một chút để lõi sáng nhưng vẫn mang sắc hồng
const lite = (rgb, k) => rgb.map(v => Math.round(v + (255 - v) * k)).join(',');
function glowSprite(rgb) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, `rgba(${lite(rgb, 0.4)},0.95)`);
  gr.addColorStop(0.14, `rgba(${rgb},0.9)`);
  gr.addColorStop(0.4, `rgba(${rgb},0.2)`);      // quầng hẹp -> viền sắc nét hơn
  gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return c;
}
function starSprite(rgb) {
  const N = 96, c = document.createElement('canvas'); c.width = c.height = N;
  const g = c.getContext('2d');
  const core = lite(rgb, 0.4), ray = lite(rgb, 0.3);
  const gr = g.createRadialGradient(N/2, N/2, 0, N/2, N/2, N/2);
  gr.addColorStop(0, `rgba(${core},0.95)`);
  gr.addColorStop(0.12, `rgba(${core},0.8)`);
  gr.addColorStop(0.28, `rgba(${rgb},0.55)`);
  gr.addColorStop(0.65, `rgba(${rgb},0.1)`);
  gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, N, N);
  for (let k = 0; k < 4; k++) {                       // 4 tia chính + 4 tia phụ chéo ngắn
    g.save(); g.translate(N/2, N/2); g.rotate(k * Math.PI / 4);
    const len = k % 2 ? N * 0.3 : N / 2, w = k % 2 ? 1.6 : 3;
    const lg = g.createLinearGradient(0, -len, 0, len);
    lg.addColorStop(0, `rgba(${ray},0)`);
    lg.addColorStop(0.5, `rgba(${ray},0.9)`);
    lg.addColorStop(1, `rgba(${ray},0)`);
    g.fillStyle = lg;
    g.beginPath();
    g.moveTo(0, -len); g.lineTo(w, 0); g.lineTo(0, len); g.lineTo(-w, 0); g.closePath();
    g.fill(); g.restore();
  }
  return c;
}
function heartSprite(rgb) {
  const N = 64, c = document.createElement('canvas'); c.width = c.height = N;
  const g = c.getContext('2d');
  g.shadowColor = `rgba(${rgb},0.9)`; g.shadowBlur = 7;
  g.fillStyle = `rgb(${rgb})`;
  g.beginPath();
  const k = 0.95;
  for (let i = 0; i <= 90; i++) {
    const [x, y] = heartXY(i / 90 * Math.PI * 2);
    const px = N/2 + x * k, py = N/2 + y * k;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath(); g.fill();
  return c;
}
const GLOWS  = PALETTE.map(glowSprite);
const STARS  = PALETTE.map(starSprite);
const HEARTS = PALETTE.slice(0, 5).map(heartSprite);

// cánh hoa hồng
function petalSprite(c1, c2) {
  const W2 = 40, H2 = 56, c = document.createElement('canvas'); c.width = W2; c.height = H2;
  const g = c.getContext('2d');
  const lg = g.createLinearGradient(0, 0, W2, H2);
  lg.addColorStop(0, c1); lg.addColorStop(1, c2);
  g.fillStyle = lg;
  g.beginPath();
  g.moveTo(W2 / 2, 2);
  g.bezierCurveTo(W2 + 6, 10, W2 - 2, H2 - 6, W2 / 2, H2 - 2);
  g.bezierCurveTo(2, H2 - 6, -6, 10, W2 / 2, 2);
  g.fill();
  g.globalAlpha = 0.35; g.strokeStyle = '#fff'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(W2 / 2, 6); g.quadraticCurveTo(W2 / 2 + 2, H2 / 2, W2 / 2, H2 - 8); g.stroke();
  return c;
}
const PETALS = [
  petalSprite('#ffc2da', '#ff6fa5'), petalSprite('#ffd9e8', '#ff8db8'), petalSprite('#ff9cc3', '#e0357a')
];
// vòng sáng bokeh mờ
function bokehSprite() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,150,200,0.35)');
  gr.addColorStop(0.8, 'rgba(255,120,180,0.5)');
  gr.addColorStop(0.92, 'rgba(255,190,220,0.8)');
  gr.addColorStop(1, 'rgba(255,120,180,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return c;
}
const BOKEH = bokehSprite();

/* ============================ HẠT TRÁI TIM ============================ */
const parts = [];
function buildParticles() {
  parts.length = 0;
  const n = W < 600 ? Math.round(PARTICLES * 0.55) : PARTICLES;
  const far = Math.max(W, H);
  for (let i = 0; i < n; i++) {
    const t = Math.random() * Math.PI * 2;
    const [hx, hy] = heartXY(t);
    const edge = Math.random() < 0.34;                       // nhiều hạt hơn ở viền -> nét sắc
    const r = edge ? 1 - Math.pow(Math.random(), 5) * 0.025 : Math.sqrt(Math.random()) * 0.97;
    const star = !edge && Math.random() < 0.16 || edge && Math.random() < 0.05;   // sao chủ yếu nằm bên trong tim
    const ang = Math.random() * Math.PI * 2, dist = far * (0.6 + Math.random() * 0.6);
    // sao: đủ các sắc hồng; hạt thường: nhạt ở tâm, đậm dần ra viền
    const pick = a => a[(Math.random() * a.length) | 0];
    const ci = star ? (Math.random() * PALETTE.length) | 0
      : r < 0.45 ? pick([7, 2, 4, 5, 1]) : r < 0.8 ? pick([4, 1, 5, 6, 2]) : pick([0, 3, 5, 6, 1]);
    parts.push({
      tx: hx * r, ty: hy * r, r,
      x: CX + Math.cos(ang) * dist, y: CY + Math.sin(ang) * dist,
      vx: 0, vy: 0,
      size: star ? 8 + Math.random() * 12 : (edge ? 2.0 : 1.6) + Math.random() * 2.6,
      star, ci,
      phase: Math.random() * 6.28, speed: star ? 1.2 + Math.random() * 2.6 : 1.5 + Math.random() * 3.5,
      base: star ? 0.7 + Math.random() * 0.25 : edge ? 0.9 : 0.5 + Math.random() * 0.4,
      delay: Math.random() * 2.0,
      fx: Math.random() * 6.28, fy: Math.random() * 6.28
    });
  }
}
buildParticles();

/* Hạt lấp lánh nền bay lên (nhẹ, không lấn át trái tim) */
const ambient = [];
function newAmbient(init) {
  return {
    x: Math.random() * W, y: init ? Math.random() * H : H + 20,
    vy: 10 + Math.random() * 24, sway: Math.random() * 6.28,
    size: 5 + Math.random() * 10, heart: Math.random() < 0.3,
    ci: (Math.random() * 5) | 0, ph: Math.random() * 6.28
  };
}
for (let i = 0; i < 45; i++) ambient.push(newAmbient(true));

/* Cánh hoa hồng rơi chầm chậm */
const petals = [];
function newPetal(init) {
  return {
    x: Math.random() * W, y: init ? Math.random() * H : -30,
    vy: 22 + Math.random() * 30, sway: Math.random() * 6.28, swayAmp: 20 + Math.random() * 30,
    size: 11 + Math.random() * 14, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 1.6,
    flip: Math.random() * 6.28, s: PETALS[(Math.random() * PETALS.length) | 0],
    a: 0.35 + Math.random() * 0.4
  };
}
for (let i = 0; i < 26; i++) petals.push(newPetal(true));

/* Bokeh mờ ảo ở nền */
const bokeh = [];
for (let i = 0; i < 14; i++) bokeh.push({
  x: Math.random() * W, y: Math.random() * H, size: 40 + Math.random() * 90,
  vx: (Math.random() - 0.5) * 6, vy: -(3 + Math.random() * 8), ph: Math.random() * 6.28,
  a: 0.05 + Math.random() * 0.07
});

/* Tim nhỏ bay lên từ trái tim theo mỗi nhịp, và sao băng thỉnh thoảng */
const floaters = [];
function spawnFloaters(k) {
  for (let i = 0; i < k; i++) {
    const [hx, hy] = heartXY(Math.random() * Math.PI * 2), r = 0.2 + Math.random() * 0.75;
    floaters.push({
      x: CX + hx * r * S, y: CY + hy * r * S, vx: (Math.random() - 0.5) * 22, vy: -(35 + Math.random() * 50),
      size: 8 + Math.random() * 12, life: 0, max: 2.2 + Math.random() * 1.6, ph: Math.random() * 6.28,
      s: HEARTS[(Math.random() * 3) | 0]
    });
  }
}
let shoot = null, nextShoot = 3;

/* ============================ NHỊP TIM ============================ */
const DUB = 0.24;
let beatPhase = 0, prevP = 0, time = 0;
function circ(p, c, w) {
  let d = Math.abs(p - c); d = Math.min(d, 1 - d);
  return Math.exp(-(d / w) * (d / w));
}
const pulseAt = p => circ(p, 0, 0.05) + 0.7 * circ(p, DUB, 0.045);   // "thịch - thịch"
const frac = x => ((x % 1) + 1) % 1;

/* ============================ ÂM THANH (tùy chọn) ============================ */
let audio = null, soundOn = false;
const soundBtn = document.getElementById('sound');
function thump(vol, freq) {
  if (!audio) return;
  const t = audio.currentTime;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(38, t + 0.14);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o.connect(g).connect(audio.destination);
  o.start(t); o.stop(t + 0.22);
}
soundBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === 'suspended') audio.resume();
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
});

/* ============================ TƯƠNG TÁC ============================ */
const rings = [];
const mouse = { x: -9999, y: -9999, active: false };

function heartPath(cx, cy, s) {
  ctx.beginPath();
  const n = 240;
  for (let i = 0; i <= n; i++) {
    const [x, y] = heartXY(i / n * Math.PI * 2);
    const px = cx + x * s, py = cy + y * s;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}
function burst(x, y, radius, power) {
  for (const p of parts) {
    const dx = p.x - x, dy = p.y - y, d = Math.hypot(dx, dy) || 1;
    if (d < radius) {
      const f = (1 - d / radius) * power;
      p.vx += dx / d * f; p.vy += dy / d * f;
    }
  }
}
function pointer(e) { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; }
window.addEventListener('pointermove', pointer);
window.addEventListener('pointerleave', () => { mouse.active = false; mouse.x = mouse.y = -9999; });
window.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') { mouse.active = false; mouse.x = mouse.y = -9999; } });
canvas.addEventListener('pointerdown', e => {
  pointer(e);
  burst(e.clientX, e.clientY, 260, 520);
  rings.push({ r: 0, a: 0.5 });
  if (soundOn) thump(0.7, 90);
});

/* ============================ VÒNG LẶP ============================ */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now; time += dt;
  beatPhase += dt * BPM / 60;
  const p = frac(beatPhase);

  if (p < prevP) { rings.push({ r: 0, a: 0.55 }); spawnFloaters(3); if (soundOn) thump(0.9, 110); }
  if (prevP < DUB && p >= DUB && soundOn) thump(0.55, 85);
  prevP = p;

  const pulse = pulseAt(p);
  ctx.clearRect(0, 0, W, H);

  // bokeh mờ ảo
  ctx.globalCompositeOperation = 'lighter';
  for (const b of bokeh) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -b.size) { b.y = H + b.size; b.x = Math.random() * W; }
    ctx.globalAlpha = b.a * (0.6 + 0.4 * Math.sin(time * 0.7 + b.ph)) * Math.min(1, time / 2);
    ctx.drawImage(BOKEH, b.x - b.size / 2, b.y - b.size / 2, b.size, b.size);
  }

  // quầng sáng mờ sau trái tim, đập theo nhịp (giữ nền đen)
  const gr = ctx.createRadialGradient(CX, CY, 0, CX, CY, S * 24);
  const ga = 0.06 + 0.12 * pulse;
  gr.addColorStop(0, `rgba(255,50,120,${ga})`);
  gr.addColorStop(0.55, `rgba(255,30,100,${ga * 0.3})`);
  gr.addColorStop(1, 'rgba(255,30,100,0)');
  ctx.globalAlpha = 1;
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);

  // ánh sáng bên trong tim: tâm trắng hồng nhạt, đập theo nhịp
  ctx.save();
  heartPath(CX, CY, S * (1 + 0.1 * pulse));
  ctx.clip();
  const ig = ctx.createRadialGradient(CX, CY - S * 1.5, 0, CX, CY, S * 17);
  const ia = Math.min(1, Math.max(0, time - 1.2) / 1.5);
  ig.addColorStop(0, `rgba(255,150,200,${(0.1 + 0.1 * pulse) * ia})`);
  ig.addColorStop(0.45, `rgba(255,90,160,${(0.06 + 0.06 * pulse) * ia})`);
  ig.addColorStop(1, `rgba(255,40,110,${(0.03 + 0.03 * pulse) * ia})`);
  ctx.fillStyle = ig; ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // cánh hoa hồng rơi (vẽ bình thường, không cộng sáng)
  ctx.globalCompositeOperation = 'source-over';
  for (const pt of petals) {
    pt.y += pt.vy * dt; pt.x += Math.sin(time * 0.9 + pt.sway) * pt.swayAmp * dt;
    pt.rot += pt.vr * dt; pt.flip += dt * 2.2;
    if (pt.y > H + 40) Object.assign(pt, newPetal(false));
    ctx.globalAlpha = pt.a * Math.min(1, time / 2);
    ctx.save();
    ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot);
    ctx.scale(Math.cos(pt.flip) * 0.8 + 0.2 * Math.sign(Math.cos(pt.flip) || 1), 1);   // lật xoay như cánh hoa thật
    ctx.drawImage(pt.s, -pt.size * 0.35, -pt.size * 0.5, pt.size * 0.7, pt.size);
    ctx.restore();
  }
  ctx.globalCompositeOperation = 'lighter';

  // hạt nền
  for (const a of ambient) {
    a.y -= a.vy * dt; a.x += Math.sin(time * 0.8 + a.sway) * 10 * dt;
    if (a.y < -30) Object.assign(a, newAmbient(false));
    ctx.globalAlpha = (0.2 + 0.25 * Math.sin(time * 2 + a.ph)) * Math.min(1, time / 2);
    const sp = a.heart ? HEARTS[a.ci] : STARS[a.ci];
    const sz = a.heart ? a.size * 0.8 : a.size * 1.5;
    ctx.drawImage(sp, a.x - sz / 2, a.y - sz / 2, sz, sz);
  }

  // vòng viền trái tim lan ra theo mỗi nhịp
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.r += dt * 0.9; r.a -= dt * 0.4;
    if (r.a <= 0) { rings.splice(i, 1); continue; }
    ctx.globalAlpha = r.a * 0.75;
    ctx.strokeStyle = '#ff7eb6'; ctx.lineWidth = 1.6;
    ctx.shadowColor = '#ff4d8d'; ctx.shadowBlur = 12;
    heartPath(CX, CY, S * (1 + r.r * 0.9));
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // các hạt lấp lánh tạo thành trái tim
  const R = 95, R2 = R * R, mx = mouse.x, my = mouse.y;
  for (let i = 0, n = parts.length; i < n; i++) {
    const q = parts[i];
    const age = time - q.delay;
    if (age < 0) continue;
    const pl = pulseAt(frac(p - q.r * 0.1));            // sóng đập lan từ tâm ra viền
    const sc = 1 + 0.1 * pl;
    const tx = CX + q.tx * S * sc + Math.sin(time * 0.9 + q.fx) * 1.2;
    const ty = CY + q.ty * S * sc + Math.cos(time * 0.8 + q.fy) * 1.2;

    q.vx += (tx - q.x) * 40 * dt; q.vy += (ty - q.y) * 40 * dt;
    if (mouse.active) {
      const dx = q.x - mx, dy = q.y - my, d2 = dx * dx + dy * dy;
      if (d2 < R2 && d2 > 0.01) {
        const d = Math.sqrt(d2), f = (1 - d / R) * 1400 * dt;
        q.vx += dx / d * f; q.vy += dy / d * f;
      }
    }
    const damp = Math.exp(-6.5 * dt);
    q.vx *= damp; q.vy *= damp;
    q.x += q.vx * dt; q.y += q.vy * dt;

    const tw = 0.5 + 0.5 * Math.sin(time * q.speed + q.phase);
    if (q.star) {
      // ngôi sao hồng: chớp nhẹ nhàng
      const k = tw * tw;
      let a = q.base * (0.35 + 0.5 * k) * (0.85 + 0.4 * pl) * Math.min(1, age / 0.7);
      if (a > 1) a = 1;
      const sz = q.size * (0.7 + 0.45 * k + 0.25 * pl) * 2.4;
      ctx.globalAlpha = a;
      ctx.drawImage(STARS[q.ci], q.x - sz / 2, q.y - sz / 2, sz, sz);
    } else {
      let a = q.base * (0.35 + 0.5 * tw) * (0.75 + 0.45 * pl) * Math.min(1, age / 0.7);
      if (a > 1) a = 1;
      const sz = q.size * (1 + 0.3 * pl) * 2.3;
      ctx.globalAlpha = a;
      ctx.drawImage(GLOWS[q.ci], q.x - sz / 2, q.y - sz / 2, sz, sz);
    }
  }

  // tim nhỏ bay lên từ trái tim
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life += dt;
    if (f.life > f.max) { floaters.splice(i, 1); continue; }
    f.x += (f.vx + Math.sin(time * 2 + f.ph) * 14) * dt; f.y += f.vy * dt;
    const k = f.life / f.max;
    ctx.globalAlpha = Math.sin(Math.min(1, k * 1.4) * Math.PI * 0.5) * (1 - k) * 0.95;
    const sz = f.size * (0.6 + 0.6 * k);
    ctx.drawImage(f.s, f.x - sz / 2, f.y - sz / 2, sz, sz);
  }

  // sao băng thỉnh thoảng lướt qua
  nextShoot -= dt;
  if (nextShoot <= 0 && !shoot) {
    shoot = { x: W * (0.5 + Math.random() * 0.5), y: -20, vx: -(420 + Math.random() * 260), vy: 260 + Math.random() * 160, life: 0 };
    nextShoot = 4 + Math.random() * 5;
  }
  if (shoot) {
    shoot.life += dt; shoot.x += shoot.vx * dt; shoot.y += shoot.vy * dt;
    const sp = Math.hypot(shoot.vx, shoot.vy);
    for (let k = 0; k < 14; k++) {
      ctx.globalAlpha = (1 - k / 14) * 0.8 * Math.max(0, 1 - shoot.life / 1.8);
      const sz = 22 * (1 - k / 18);
      const tx = shoot.x - shoot.vx / sp * k * 11, ty = shoot.y - shoot.vy / sp * k * 11;
      ctx.drawImage(GLOWS[k < 3 ? 7 : 4], tx - sz / 2, ty - sz / 2, sz, sz);
    }
    if (shoot.life > 1.8 || shoot.x < -50 || shoot.y > H + 50) shoot = null;
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}
window.addEventListener('resize', () => {
  resize(); buildParticles(); time = Math.max(time, 3); parts.forEach(p => p.delay = 0);
});
requestAnimationFrame(frame);
</script>
